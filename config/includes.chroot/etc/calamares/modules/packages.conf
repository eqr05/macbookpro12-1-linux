# Extras que solo se instalan en el sistema instalado (no en el live).
# try_install: si falla (por ejemplo sin internet) solo avisa y la
# instalacion continua. skip_if_no_internet evita el error sin conexion.
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
  - try_install:
      - 'mbpfan'
      - 'qemu-system-x86'
      - 'qemu-utils'

skip_if_no_internet: true
